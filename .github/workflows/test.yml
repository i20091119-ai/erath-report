name: 장기 엔진 시험
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test janggi/test/engine.test.js
      - run: python3 -m unittest test_engine.py
        working-directory: janggi/python
